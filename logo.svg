<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7ff"/>
    </linearGradient>
    <linearGradient id="wingGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="wingGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Clean White & Blue Rounded Container -->
  <rect x="5" y="5" width="190" height="190" rx="42" ry="42" fill="url(#bgGrad)" stroke="#dbeafe" stroke-width="3"/>

  <!-- Owl Head & Wings Vector in Crisp Blue & White -->
  <g transform="translate(100, 78)">
    <!-- Wings Umbrella Shape -->
    <path d="M 0,-15 Q -38,-5 -44,30 Q -20,28 0,38 Q 20,28 44,30 Q 38,-5 0,-15 Z" fill="url(#wingGradLeft)"/>
    <path d="M 0,-15 Q 38,-5 44,30 Q 20,28 0,38 Z" fill="url(#wingGradRight)"/>

    <!-- Eyeglasses / Eyes Bridge -->
    <path d="M -30,-22 L -12,-8 L 0,-18 L 12,-8 L 30,-22" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Left Eye Circle -->
    <circle cx="-20" cy="-14" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="4.5"/>
    <circle cx="-20" cy="-14" r="5" fill="#1d4ed8"/>
    <circle cx="-18" cy="-16" r="2" fill="#ffffff"/>

    <!-- Right Eye Circle -->
    <circle cx="20" cy="-14" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="4.5"/>
    <circle cx="20" cy="-14" r="5" fill="#1d4ed8"/>
    <circle cx="22" cy="-16" r="2" fill="#ffffff"/>
  </g>

  <!-- Typography: SAANKALP -->
  <text x="100" y="160" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#1d4ed8" text-anchor="middle" letter-spacing="3">SAANKALP</text>
</svg>
